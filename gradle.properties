org.gradle.console=plain
org.gradle.logging.level=quiet
org.gradle.warning.mode=none
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.java.installations.auto-download=true
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --sun-misc-unsafe-memory-access=allow
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
kotlin.compiler.runViaBuildToolsApi=false
# Mutation testing (specs/001-harness-quality-gates research.md "Arcmutate licence outcome"): the Arcmutate Kotlin
# plugin is commercial and no licence exists for this public repository, so the exclusions fallback is used.
harness.pitest.arcmutate=false
# Test layers start PostgreSQL/Kafka containers per module; more than four parallel workers overloads a laptop-class
# container engine (start timeouts) without making the gate faster. CI runners may raise it with --max-workers.
org.gradle.workers.max=4
