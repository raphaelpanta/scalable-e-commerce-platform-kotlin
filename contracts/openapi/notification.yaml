openapi: 3.1.0
info:
  title: Notification API
  version: 1.0.0
  summary: Shopper notification history and operator visibility into failed deliveries.
  description: |
    Public contract of the notification service as exposed through the gateway under
    `/api/v1/notifications`. Covers FR-018 and FR-019 (user story 6).

    Notifications are created only by the service itself in reaction to events from the identity,
    order and payment services (duplicate events never produce duplicate messages); there is no
    public create operation. Delivery is retried with increasing delay up to a limit, after which
    the notification is `failed` and visible to operators. Notification preferences (FR-020) are
    part of the customer account and live in the identity API.

    All operations require a bearer JWT. Roles: `shopper` (own notifications only) and `operator`.
    Timestamps are UTC.
servers:
  - {url: 'https://localhost:8443', description: Local gateway (the only public entry point)}
security:
  - bearerAuth: []
tags:
  - {name: Notifications, description: Shopper-facing notification history}
  - {name: Operator, description: Operator-only delivery supervision}
paths:
  /api/v1/notifications:
    get:
      tags: [Notifications]
      operationId: listOwnNotifications
      summary: List the caller's notifications, newest first
      description: |
        Required role - `shopper`. Returns only the authenticated shopper's notifications, newest
        first, with delivery status and attempt count. Message bodies are not returned.
      parameters:
        - {name: channel, in: query, description: Restrict to one channel., schema: {$ref: '#/components/schemas/Channel'}}
        - {name: type, in: query, description: Restrict to one notification type., schema: {$ref: '#/components/schemas/NotificationType'}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of notifications.
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
              example:
                items:
                  - {id: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b, channel: email, type: order_shipped, status: sent, attempts: 1, orderId: 0b9a3b0e-62b7-4f55-8d7e-0c3a6d1d9a10, createdAt: '2026-10-03T08:00:01Z', sentAt: '2026-10-03T08:00:03Z'}
                  - {id: 2a3b4c5d-6e7f-4809-9a1b-2c3d4e5f6a7b, channel: sms, type: order_shipped, status: queued, attempts: 0, orderId: 0b9a3b0e-62b7-4f55-8d7e-0c3a6d1d9a10, createdAt: '2026-10-03T08:00:01Z'}
                page: 0
                size: 20
                totalItems: 2
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/notifications/failed:
    get:
      tags: [Operator]
      operationId: listFailedNotifications
      summary: List failed deliveries across accounts (operator)
      description: |
        Required role - `operator`; shoppers receive 403. Lists notifications whose status is
        `failed`, across all accounts, newest failure first, with optional filters (FR-019).
      parameters:
        - {name: accountId, in: query, description: Only failures for this account., schema: {type: string, format: uuid}}
        - {name: channel, in: query, schema: {$ref: '#/components/schemas/Channel'}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/NotificationType'}}
        - {name: failedFrom, in: query, description: Inclusive lower bound on the time of the last failed attempt., schema: {type: string, format: date-time}}
        - {name: failedTo, in: query, description: Exclusive upper bound on the time of the last failed attempt., schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of failed notifications, including the account they belong to.
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
              example:
                items:
                  - {id: 3b4c5d6e-7f80-4a91-8b2c-3d4e5f6a7b8c, accountId: 7c1d4f3e-0a52-4c0b-8d3a-1e2f3a4b5c6d, channel: email, type: order_confirmation, status: failed, attempts: 5, lastError: 'Outbound channel timeout after 5000 ms', orderId: 0b9a3b0e-62b7-4f55-8d7e-0c3a6d1d9a10, createdAt: '2026-10-02T10:15:02Z', lastAttemptAt: '2026-10-02T10:42:10Z'}
                page: 0
                size: 20
                totalItems: 1
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The caller is not an operator.
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://ecommerce.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: This capability requires the operator role.
                instance: /api/v1/notifications/failed
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/notifications/{notificationId}/retry:
    post:
      tags: [Operator]
      operationId: retryFailedNotification
      summary: Re-queue a failed notification (operator)
      description: |
        Required role - `operator`; shoppers receive 403. Moves a `failed` notification back to
        `queued` and resets its retry budget; delivery then follows the normal retry policy. A
        notification in any other status answers 409. Retrying never sends a second copy of a
        message that was already `sent`.
      parameters:
        - {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: The notification was re-queued; delivery is asynchronous.
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
              example: {id: 3b4c5d6e-7f80-4a91-8b2c-3d4e5f6a7b8c, accountId: 7c1d4f3e-0a52-4c0b-8d3a-1e2f3a4b5c6d, channel: email, type: order_confirmation, status: queued, attempts: 0, orderId: 0b9a3b0e-62b7-4f55-8d7e-0c3a6d1d9a10, createdAt: '2026-10-02T10:15:02Z'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No notification with this id.
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://ecommerce.example/problems/not-found
                title: Notification not found
                status: 404
                detail: No notification exists with the given id.
                instance: /api/v1/notifications/3b4c5d6e-7f80-4a91-8b2c-3d4e5f6a7b8c/retry
        '409':
          description: The notification is not in the `failed` status.
          headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://ecommerce.example/problems/notification-not-failed
                title: Notification is not retryable
                status: 409
                detail: Only failed notifications can be retried; this one is sent.
                instance: /api/v1/notifications/3b4c5d6e-7f80-4a91-8b2c-3d4e5f6a7b8c/retry
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by the identity service; carries the `shopper` or `operator` role.
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional correlation id; a malformed value is replaced by the gateway.
      schema: {type: string, maxLength: 64}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
  headers:
    CorrelationId:
      description: Correlation id of the request, echoed on every response.
      schema: {type: string}
  responses:
    BadRequest:
      description: Malformed request.
      headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unauthorized:
      description: Missing, expired or invalid bearer token.
      headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: Authenticated but the role is not allowed.
      headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Resource does not exist.
      headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
        Retry-After: {description: Seconds to wait., schema: {type: integer}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ServiceUnavailable:
      description: Service or a dependency is temporarily unavailable.
      headers: {X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
    Channel:
      type: string
      description: |
        email is the default channel; sms is used only for shoppers who opted in with a
        verified phone number (FR-018).
      enum: [email, sms]
    NotificationType:
      type: string
      description: |
        registration_verification and password_reset come from identity events; order_confirmation,
        order_shipped and order_delivered from order events; payment_failure from payment events.
      enum: [registration_verification, password_reset, order_confirmation, payment_failure, order_shipped, order_delivered]
    DeliveryStatus:
      type: string
      description: queued is waiting for (re)delivery, sent is final, failed means the retry limit was reached.
      enum: [queued, sent, failed]
    Notification:
      type: object
      required: [id, channel, type, status, attempts, createdAt]
      properties:
        id: {type: string, format: uuid}
        accountId: {type: string, format: uuid, description: Recipient account; returned to operators only.}
        channel: {$ref: '#/components/schemas/Channel'}
        type: {$ref: '#/components/schemas/NotificationType'}
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        attempts: {type: integer, minimum: 0, description: Delivery attempts made so far.}
        lastError:
          type: string
          description: Reason of the latest failed attempt; absent when no attempt failed.
        orderId: {type: string, format: uuid, description: Related order, for order and payment notifications.}
        createdAt: {type: string, format: date-time}
        lastAttemptAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time, description: Present once status is sent.}
    NotificationPage:
      type: object
      required: [items, page, size, totalItems]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Notification'}}, page: {type: integer, minimum: 0}, size: {type: integer, minimum: 1, maximum: 100}, totalItems: {type: integer, format: int64, minimum: 0}}
