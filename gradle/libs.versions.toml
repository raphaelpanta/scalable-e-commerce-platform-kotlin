# The only place in this repository where a version may appear (constitution Principle I, FR-004).
# Any version literal in a *.gradle.kts file fails `./gradlew checkVersionLiterals`.
# Latest-stable lookups resolved on 2026-10-02 (Maven Central / Gradle Plugin Portal).

[versions]
gradle = "9.8.0"
jdk = "25"
kotlin = "2.3.21"
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
kotest = "6.2.5"
pitest = "1.30.0"
pitest-gradle-plugin = "1.19.0"
pitest-junit5-plugin = "1.2.3"
# Commercial Kotlin plugin for Pitest; used only with harness.pitest.arcmutate=true (off by default, needs a licence)
arcmutate-pitest-kotlin-plugin = "1.5.1"
pact = "4.7.5"
cucumber = "7.34.9"
testcontainers = "2.0.5"
konsist = "0.17.3"
archunit = "1.5.1"
ktlint-gradle-plugin = "14.2.0"
ktlint = "1.8.0"
# dev.detekt has no 2.x GA yet; 2.0.0-alpha.6 is the only line built on Kotlin 2.4 (Gradle 9.8 embedded Kotlin)
detekt = "2.0.0-alpha.6"
mockk = "1.14.11"
wiremock = "3.13.2"
# JUnit Platform line used by Kotest 6.2.5 (Spring Boot's BOM aligns it upwards in service modules)
junit-platform = "1.13.4"
# Same value Spring Boot 4.1.1 manages; needed by pure-Kotlin modules that do not import the Boot BOM
kotlinx-coroutines = "1.10.2"
foojay-resolver = "1.0.0"
# Feature 004 additions (resolved on Maven Central 2026-10-02)
arrow = "2.2.3"
bouncycastle = "1.86"
# Logback -> OpenTelemetry log bridge (Loki). The Spring Boot BOM manages only the OpenTelemetry core (1.62.0 in Boot
# 4.1.1), not the instrumentation line: 2.28.1-alpha is the newest release built on opentelemetry-api 1.62.0 (the
# latest, 2.31.1-alpha on 2026-10-03, needs 1.65.0 and would split the API from the Boot-managed SDK). Bump together
# with Spring Boot.
opentelemetry-logback-appender = "2.28.1-alpha"
# OpenAPI 3.1 request/response validator of the integration layer (T138); latest on Maven Central 2026-10-03 (the
# artifact moved from swagger-request-validator-core, whose 3.0.0 is only a relocation). Jackson 2 based: kept off the
# runtime classpath, integrationTest only.
openapi-request-validator = "3.0.0"
# GraalVM Native Build Tools (Maven Central 2026-09-18). Not applied by any build file: only the native images of
# platform/docker/Dockerfile.native load it, through platform/docker/native/native-image.init.gradle.kts, which reads
# this line (the Dockerfile passes it as NATIVE_BUILD_TOOLS_VERSION).
native-build-tools = "1.1.14"

[libraries]
# Gradle plugins consumed by build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle-plugin" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
pitest-gradle-plugin = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "pitest-gradle-plugin" }

# Test libraries
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-r2dbc = { module = "org.testcontainers:testcontainers-r2dbc", version.ref = "testcontainers" }
pact-consumer-junit5 = { module = "au.com.dius.pact.consumer:junit5", version.ref = "pact" }
pact-provider-junit5 = { module = "au.com.dius.pact.provider:junit5", version.ref = "pact" }
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
cucumber-spring = { module = "io.cucumber:cucumber-spring", version.ref = "cucumber" }
cucumber-picocontainer = { module = "io.cucumber:cucumber-picocontainer", version.ref = "cucumber" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite", version.ref = "junit-platform" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5-plugin" }
arcmutate-pitest-kotlin-plugin = { module = "com.arcmutate:pitest-kotlin-plugin", version.ref = "arcmutate-pitest-kotlin-plugin" }

# Kotlin coroutines (versioned for pure-Kotlin modules; equals the Boot-managed value)
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinx-coroutines" }

# Managed by the Spring Boot BOM (no version here on purpose)
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
context-propagation = { module = "io.micrometer:context-propagation" }
postgresql = { module = "org.postgresql:postgresql" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-kafka-test = { module = "org.springframework.boot:spring-boot-starter-kafka-test" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
awaitility = { module = "org.awaitility:awaitility" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
# WebClient.Builder auto-configuration with observation (Boot 4 moved it out of WebFlux); an `api` of platform-core,
# so every service's internal clients (WebClientDefaults) send `traceparent`
spring-boot-starter-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient" }

# Managed by the Spring Cloud BOM (imported where used: the gateway and the internal HTTP clients)
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }

# Functional error values (domain and application modules) and password hashing (identity)
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }

# Logback appender that turns every log event into an OpenTelemetry log record (exported over OTLP to Loki)
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-logback-appender" }

# OpenAPI request/response validator (integrationTest of the service modules, contract conformance)
openapi-request-validator-core = { module = "com.atlassian.oai:openapi-request-validator-core", version.ref = "openapi-request-validator" }

[bundles]
kotest = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-property"]

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle-plugin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
