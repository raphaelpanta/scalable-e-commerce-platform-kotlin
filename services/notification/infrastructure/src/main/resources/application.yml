spring:
  application:
    name: notification
  r2dbc:
    url: r2dbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:5432/notification
    # No committed defaults: credentials come from the environment only.
    username: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
  flyway:
    # Documented blocking exception (constitution Principle IV, plan Complexity Tracking): Flyway migrates
    # over JDBC once at start-up, before the service reports ready; every request path stays non-blocking.
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:5432/notification
    user: ${NOTIFICATION_DB_USER}
    password: ${NOTIFICATION_DB_PASSWORD}
    # The service schema (V2__) after the generator baseline and platform-messaging's outbox/processed_event.
    locations: classpath:db/migration,classpath:db/messaging
  mail:
    # Mailpit locally (docs/service-conventions.md §2). JavaMailSender blocks: every send runs on
    # Dispatchers.IO (documented exception, services/notification/README.md "Blocking exception").
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  reactor:
    # Restores thread locals (such as an MDC correlation id) on Reactor operators.
    context-propagation: auto

notification:
  # Base of the links in verification and password-reset messages.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  identity-url: ${IDENTITY_URL:http://localhost:8080}
  internal-token: ${INTERNAL_API_TOKEN:}
  mail-from: notifications@ecommerce.example
  delivery:
    enabled: true
    poll-interval: 1s
    batch-size: 20
    # A claimed notification is invisible to other instances for this long (longer than any send).
    lease: 2m
    # FR-019 / data-model §1: 5 attempts, exponential from 30 s, capped at 10 min, then failed.
    max-attempts: 5
    initial-delay: 30s
    max-delay: 10m
  retention:
    # Data-model section 5 / FR-007: sent, failed and suppressed notifications (and their delivery attempts) older
    # than this are deleted by NotificationPurgeJob every purge-interval; queued ones are never purged.
    notifications: 90d
    batch-size: 500
    purge-interval: 1h

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # No components and no details: /actuator/health answers {"status":"...","groups":["liveness","readiness"]},
      # the two groups answer exactly {"status":"..."} (FR-026, docs/service-conventions.md section 2).
      show-components: never
      show-details: never
      # /actuator/health/liveness (the process is alive) and /actuator/health/readiness (traffic may come); the
      # image HEALTHCHECK and Compose probe the readiness group. Add a database contributor to readiness once the
      # service has one (services/catalog: HealthProbe adapter `db`).
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    # The built-in R2DBC indicator has no timeout and hangs while the database is unreachable; database
    # health belongs in a HealthProbe adapter with a timeout, as in services/catalog (DatabaseHealthProbe).
    r2dbc:
      enabled: false
    # An unreachable SMTP server is handled by the retry schedule (FR-019); it must not take the service down.
    mail:
      enabled: false

logging:
  structured:
    format:
      console: ecs
