spring:
  application:
    name: order
  r2dbc:
    url: r2dbc:postgresql://${ORDER_DB_HOST:localhost}:5432/order
    # No committed defaults: credentials come from the environment only.
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
  flyway:
    # Documented blocking exception (constitution Principle IV, plan Complexity Tracking): Flyway migrates
    # over JDBC once at start-up, before the service reports ready; every request path stays non-blocking.
    url: jdbc:postgresql://${ORDER_DB_HOST:localhost}:5432/order
    user: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
    # The service schema plus the outbox and processed-event tables of libs/platform-messaging.
    locations: classpath:db/migration,classpath:db/messaging
  reactor:
    # Restores thread locals (such as an MDC correlation id) on Reactor operators.
    context-propagation: auto

# platform.security.* (JWKS_URI, JWT_ISSUER, JWT_AUDIENCE, INTERNAL_API_TOKEN) comes from the platform defaults;
# every order path requires a bearer token, so no public path is declared.

order:
  clients:
    cart-url: ${CART_URL:http://localhost:8080}
    catalog-url: ${CATALOG_URL:http://localhost:8080}
    payment-url: ${PAYMENT_URL:http://localhost:8080}
    identity-url: ${IDENTITY_URL:http://localhost:8080}
  payment-expiry:
    # How often the job looks for payments still pending 30 minutes after placement, and how many per pass.
    interval: 1m
    batch-size: 100
  idempotency-purge:
    # Checkout idempotency records are kept 24 hours (data-model section 5); expired ones are deleted this often.
    interval: 1h

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # No components and no details: /actuator/health answers {"status":"...","groups":["liveness","readiness"]},
      # the two groups answer exactly {"status":"..."} (FR-026, docs/service-conventions.md section 2).
      show-components: never
      show-details: never
      # /actuator/health/liveness (the process is alive) and /actuator/health/readiness (traffic may come); the
      # image HEALTHCHECK and Compose probe the readiness group. Add a database contributor to readiness once the
      # service has one (services/catalog: HealthProbe adapter `db`).
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    # The built-in R2DBC indicator has no timeout and hangs while the database is unreachable; database
    # health belongs in a HealthProbe adapter with a timeout, as in services/catalog (DatabaseHealthProbe).
    r2dbc:
      enabled: false

logging:
  structured:
    format:
      console: ecs
