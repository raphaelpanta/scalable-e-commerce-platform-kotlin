spring:
  application:
    name: identity
  r2dbc:
    url: r2dbc:postgresql://${IDENTITY_DB_HOST:localhost}:5432/identity
    # No committed defaults: credentials come from the environment only.
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
  flyway:
    # Documented blocking exception (constitution Principle IV, plan Complexity Tracking): Flyway migrates
    # over JDBC once at start-up, before the service reports ready; every request path stays non-blocking.
    url: jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:5432/identity
    user: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
    # The service schema (V2__) after the generator baseline and platform-messaging's outbox/processed_event;
    # the `seed` profile (SEED=true) adds classpath:db/seed (application-seed.yml).
    locations: classpath:db/migration,classpath:db/messaging
  mail:
    # Mailpit locally (docs/service-conventions.md section 2): the simulated SMS channel mirrors every SMS there.
    # JavaMailSender blocks: every send runs on Dispatchers.IO (services/identity/README.md "Blocking exceptions").
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  reactor:
    # Restores thread locals (such as an MDC correlation id) on Reactor operators.
    context-propagation: auto

platform:
  security:
    # The anonymous operations of identity.yaml and the JWKS document; every other operation needs a bearer token
    # (validated against this service's own signing keys) and /internal/** needs X-Internal-Token.
    public-paths:
      - POST /api/v1/identity/accounts
      - POST /api/v1/identity/accounts/verify-email
      - POST /api/v1/identity/sessions
      - POST /api/v1/identity/sessions/refresh
      - POST /api/v1/identity/password-resets
      - POST /api/v1/identity/password-resets/complete
      - GET /.well-known/jwks.json

identity:
  # Ed25519 private key (PKCS#8, PEM or Base64) that signs access tokens, shared by every instance (FR-024).
  # Blank fails start-up unless the profile dev or test is active (then a throw-away key is generated).
  # Generate: openssl genpkey -algorithm ed25519 -outform DER | base64
  signing-key: ${IDENTITY_SIGNING_KEY:}
  # kid of that key; blank uses the RFC 7638 thumbprint of its public key.
  signing-key-id: ${IDENTITY_SIGNING_KEY_ID:}
  access-token-lifetime: 15m
  session-lifetime: 30d
  sign-in:
    # FR-006 / data-model section 1: 5 consecutive failures lock an account for 15 minutes.
    account-max-failures: 5
    account-lock: 15m
    # The same 5 per source address (FR-006); everyone behind one address (a NAT, the acceptance runner) shares it,
    # so an environment may raise it with IDENTITY_SOURCE_MAX_FAILURES. Emails without an account count like accounts.
    source-max-failures: ${IDENTITY_SOURCE_MAX_FAILURES:5}
    source-lock: 15m
  retention:
    # Data-model section 5: rows past these ages are deleted by IdentityPurgeJob every purge-interval.
    tokens: 7d
    sessions: 30d
    throttle-idle: 1d
    phone-verifications: 1d
    purge-interval: 1h
  sms:
    from: sms@ecommerce.example

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # No components and no details: /actuator/health answers {"status":"...","groups":["liveness","readiness"]},
      # the two groups answer exactly {"status":"..."} (FR-026, docs/service-conventions.md section 2).
      show-components: never
      show-details: never
      # /actuator/health/liveness (the process is alive) and /actuator/health/readiness (traffic may come); the
      # image HEALTHCHECK and Compose probe the readiness group. Add a database contributor to readiness once the
      # service has one (services/catalog: HealthProbe adapter `db`).
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    # The built-in R2DBC indicator has no timeout and hangs while the database is unreachable; database
    # health belongs in a HealthProbe adapter with a timeout, as in services/catalog (DatabaseHealthProbe).
    r2dbc:
      enabled: false
    # An unreachable SMTP server only fails phone verification requests (503); it must not take the service down.
    mail:
      enabled: false

logging:
  structured:
    format:
      console: ecs
