# Test-only overrides, loaded on top of the main application.yml. Spring's test context cache closes the
# application in a JVM shutdown hook, after Gradle stops capturing test output; keep that shutdown quiet. Without
# Ryuk (Podman) Testcontainers stops the containers in a concurrent hook, so the R2DBC driver, the outbox relay and
# the Kafka clients may still talk to containers that are already gone.
logging:
  level:
    org.springframework.boot.reactor.netty.GracefulShutdown: warn
    io.r2dbc.postgresql.client.ReactorNettyClient: "off"
    com.ecommerce.platform.messaging.PeriodicJob: error
    org.apache.kafka: error
    org.springframework.kafka: warn
    # The Docker client retries a dropped connection at INFO while Testcontainers stops the containers at exit.
    com.github.dockerjava: warn

management:
  # No collector in tests: the OTLP exporters of platform-core's defaults stay off.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false
