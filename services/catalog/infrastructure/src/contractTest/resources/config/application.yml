# Test-only overrides, loaded on top of the main application.yml. Spring's test context cache closes the
# application in a JVM shutdown hook, after Gradle stops capturing test output; keep that shutdown quiet.
logging:
  level:
    # Testcontainers' Docker client retries dropped socket responses at INFO (Podman shim); not a test signal
    com.github.dockerjava: warn
    org.springframework.boot.reactor.netty.GracefulShutdown: warn
    # Testcontainers stops the database while R2DBC connections are still open; the resulting "Connection
    # reset" is expected at shutdown and would otherwise print at ERROR level (Principle VIII).
    io.r2dbc.postgresql.client.ReactorNettyClient: "off"
    com.ecommerce.platform.messaging.PeriodicJob: error
    org.apache.kafka: error
    org.springframework.kafka: warn
    # The audit trail of the provider states and consumer pacts is not what this layer checks.
    com.ecommerce.catalog.audit: error

management:
  # No collector in tests: the OTLP exporters of platform-core's defaults stay off.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  logging:
    export:
      otlp:
        enabled: false

spring:
  kafka:
    # The contract layer has no broker: the message pacts drive the listener directly.
    listener:
      auto-startup: false
    admin:
      auto-create: false

platform:
  security:
    internal-token: pact-internal-token
  messaging:
    outbox:
      relay-enabled: false
    topics:
      create: false

catalog:
  # The pacts' reservations are fixtures of 2026-10-02; the expiry job must not release them during verification.
  expiry-interval: 1d
