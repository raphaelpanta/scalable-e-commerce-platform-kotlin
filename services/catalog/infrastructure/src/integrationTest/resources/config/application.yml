# Test-only overrides, loaded on top of the main application.yml. Spring's test context cache closes the
# application in a JVM shutdown hook, after Gradle stops capturing test output; keep that shutdown quiet. Without
# Ryuk (Podman) Testcontainers stops the containers in a concurrent hook, so the R2DBC driver, the outbox relay, the
# jobs and the Kafka clients may still talk to containers that are already gone.
logging:
  level:
    org.springframework.boot.reactor.netty.GracefulShutdown: warn
    io.r2dbc.postgresql.client.ReactorNettyClient: "off"
    com.ecommerce.platform.messaging.PeriodicJob: error
    org.apache.kafka: error
    org.springframework.kafka: warn

management:
  otlp:
    metrics:
      export:
        # No collector in tests.
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

platform:
  messaging:
    outbox:
      poll-interval: 100ms
    consumer:
      # Small and fast retries so a failing record does not hold the listener for long.
      max-attempts: 3
      initial-interval: 50ms
      max-interval: 200ms
