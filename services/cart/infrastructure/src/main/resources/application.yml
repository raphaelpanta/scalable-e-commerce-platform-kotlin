spring:
  application:
    name: cart
  r2dbc:
    url: r2dbc:postgresql://${CART_DB_HOST:localhost}:5432/cart
    # No committed defaults: credentials come from the environment only.
    username: ${CART_DB_USER}
    password: ${CART_DB_PASSWORD}
  flyway:
    # Documented blocking exception (constitution Principle IV, plan Complexity Tracking): Flyway migrates
    # over JDBC once at start-up, before the service reports ready; every request path stays non-blocking.
    url: jdbc:postgresql://${CART_DB_HOST:localhost}:5432/cart
    user: ${CART_DB_USER}
    password: ${CART_DB_PASSWORD}
    # The service schema plus the outbox and processed_event tables of libs/platform-messaging.
    locations: classpath:db/migration,classpath:db/messaging
  reactor:
    # Restores thread locals (such as an MDC correlation id) on Reactor operators.
    context-propagation: auto

platform:
  security:
    # Every cart operation except mergeCart is open to anonymous callers (cart.yaml `security: [{}, bearerAuth]`);
    # a bearer token that is present is still validated, and /internal/** is guarded by X-Internal-Token.
    public-paths:
      - GET /api/v1/cart
      - DELETE /api/v1/cart
      - POST /api/v1/cart/lines
      - PUT /api/v1/cart/lines/{lineId}
      - DELETE /api/v1/cart/lines/{lineId}

cart:
  # Internal pricing API of the catalog service (catalog-internal.yaml); Compose sets http://catalog:8080.
  catalog-url: ${CATALOG_URL:http://localhost:8080}
  currency: ${PLATFORM_CURRENCY:BRL}
  # Anonymous carts untouched for this long are deleted (data-model section 5), checked every purge-interval.
  anonymous-idle-timeout: 30d
  purge-interval: 1h

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # No components and no details: /actuator/health answers {"status":"...","groups":["liveness","readiness"]},
      # the two groups answer exactly {"status":"..."} (FR-026, docs/service-conventions.md section 2).
      show-components: never
      show-details: never
      # /actuator/health/liveness (the process is alive) and /actuator/health/readiness (traffic may come); the
      # image HEALTHCHECK and Compose probe the readiness group. Add a database contributor to readiness once the
      # service has one (services/catalog: HealthProbe adapter `db`).
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    # The built-in R2DBC indicator has no timeout and hangs while the database is unreachable; database
    # health belongs in a HealthProbe adapter with a timeout, as in services/catalog (DatabaseHealthProbe).
    r2dbc:
      enabled: false

logging:
  structured:
    format:
      console: ecs
