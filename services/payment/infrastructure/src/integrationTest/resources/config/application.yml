# Test-only overrides, loaded on top of the main application.yml. Spring's test context cache closes the
# application in a JVM shutdown hook, after Gradle stops capturing test output; keep that shutdown quiet. Without
# Ryuk (Podman) the containers stop concurrently, so the R2DBC driver, the outbox relay and the Kafka clients may
# still poll a database or broker that is already gone.
logging:
  level:
    org.springframework.boot.reactor.netty.GracefulShutdown: warn
    io.r2dbc.postgresql.client.ReactorNettyClient: "off"
    com.ecommerce.platform.messaging.PeriodicJob: error
    org.apache.kafka: error
    org.springframework.kafka: warn
    com.github.dockerjava: warn
    com.ecommerce.payment.infrastructure: warn

# No OpenTelemetry collector runs in this layer.
management:
  tracing:
    export:
      enabled: false
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

platform:
  messaging:
    outbox:
      poll-interval: 100ms
    consumer:
      max-attempts: 3
      initial-interval: 100ms
      max-interval: 500ms
