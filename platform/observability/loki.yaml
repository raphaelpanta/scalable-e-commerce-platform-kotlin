# Single-node Loki with filesystem storage (local development). Logs arrive through the OpenTelemetry Collector on the
# native OTLP endpoint /otlp. Retention is 3 days.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 72h
  otlp_config:
    resource_attributes:
      attributes_config:
        # `service` (copied from service.name by the collector) is an index label next to the default ones.
        - action: index_label
          attributes:
            - service

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
