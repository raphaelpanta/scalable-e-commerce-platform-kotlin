apiVersion: 1

deleteDatasources: []

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Log -> trace: a `traceId` (ECS field) or `trace_id` (OTLP trace context) value becomes a link to Tempo.
      derivedFields:
        - name: traceId
          matcherType: label
          matcherRegex: traceId
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Open trace in Tempo
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Open trace in Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Trace -> logs: show the log lines of the same trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        customQuery: true
        query: '{service=~".+"} | trace_id="$${__trace.traceId}" or traceId="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
