# Prometheus scrape configuration. Targets are discovered through Docker DNS (dns_sd_configs, type A): the name of a
# Compose service resolves to the address of EVERY replica, so `--scale catalog=2` yields two targets and a stopped
# replica disappears at the next refresh. Management port 8081 serves /actuator/prometheus (docs/service-conventions.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [gateway, identity, catalog, cart, order, payment, notification]
        type: A
        port: 8081
        refresh_interval: 5s
    relabel_configs:
      # service = Compose service name (gateway, identity, ...); instance = ip:port of the replica.
      - source_labels: [__meta_dns_name]
        target_label: service

  # Metrics received over OTLP and re-exposed by the OpenTelemetry Collector, plus the collector's own telemetry.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
