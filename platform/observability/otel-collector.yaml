# OpenTelemetry Collector (contrib). Every service exports OTLP/HTTP to http://otel-collector:4318
# (OTEL_EXPORTER_OTLP_ENDPOINT). One coherent flow per signal:
#   logs    OTLP -> Loki native OTLP endpoint (http://loki:3100/otlp)
#   traces  OTLP -> Tempo (OTLP gRPC, tempo:4317)
#   metrics OTLP -> `prometheus` exporter on :8889, which Prometheus PULLS (job `otel-collector`).
# Micrometer HTTP/JVM metrics are not routed through the collector: Prometheus scrapes /actuator/prometheus on port 8081 of
# every service directly (see prometheus.yml), so that scaled replicas are individually visible.
#
# Browser telemetry (spec 005, FR-032): the storefront's OpenTelemetry web SDK exports spans and client-error log records
# through the gateway (`/api/v1/telemetry/v1/{traces,logs}`) to the same OTLP/HTTP receiver, with resource
# `service.name=storefront`. The storefront `telemetry` module is the first privacy layer (attribute allow-list, route
# templates instead of URLs); this file is the second one. A `routing` connector splits each signal by `service.name`:
# storefront data goes through `attributes/storefront` and `redaction/storefront` before joining the exporters of the
# services' data, which keeps its processors unchanged.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
  # Log records come from the OpenTelemetry Logback appender of every service and of the gateway (logback-spring.xml):
  # body = the log message, severity, the trace context of the request, attributes `correlationId` (MDC) and the
  # key-value pairs of the line (`originalCorrelationId`, the gateway's method/path/status/durationMs), resource
  # `service.name`. Loki stores the record attributes as structured metadata (`trace_id`/`span_id` natively) and
  # indexes the resource attributes named in loki.yaml.
  transform/logs:
    error_mode: ignore
    log_statements:
      # The dashboards use the short label `service` (Loki's default label is service_name).
      - set(resource.attributes["service"], resource.attributes["service.name"]) where resource.attributes["service"] == nil
      # `level` (INFO, WARN, ERROR...) becomes an index label below; traceId/spanId keep the ECS console names, so
      # one query style works for both, and the Loki data source links traceId to Tempo.
      - set(log.attributes["level"], log.severity_text) where log.severity_text != nil and log.severity_text != ""
      - set(log.attributes["traceId"], log.trace_id.string) where log.trace_id.string != "00000000000000000000000000000000"
      - set(log.attributes["spanId"], log.span_id.string) where log.span_id.string != "0000000000000000"
  # Loki can index resource attributes only: moving `level` to the resource splits each batch by level, so loki.yaml
  # can make it a label next to `service`.
  groupbyattrs/level:
    keys: [level]
  # Storefront only (routed below). First layer of the collector-side guard: the forbidden keys of
  # specs/005-storefront-dev-bootstrap/contracts/openapi/telemetry.yaml are deleted from span and log record attributes
  # whatever their value: concrete URLs and query strings (`http.route` and `page.route`, the route templates, stay),
  # user identity, request/response headers (cookies, Authorization) and database attributes.
  attributes/storefront:
    actions:
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: url.path
        action: delete
      - pattern: ^user\..*
        action: delete
      - pattern: ^enduser\..*
        action: delete
      - pattern: ^http\.request\.header\..*
        action: delete
      - pattern: ^http\.response\.header\..*
        action: delete
      - pattern: ^db\..*
        action: delete
  # Second layer, allow-list: every span, log record and resource attribute whose key is not listed is removed
  # (data-model.md section 3.5 plus the semantic resource keys of the SDK; no `browser.*`, no `http.url`, no
  # `http.user_agent`, no headers). Values of the kept attributes (and string log bodies) that look like an email, a JWT
  # or a cookie are masked. `summary: info` adds only the counts of redacted and masked keys to the span or record
  # (`redaction.redacted.count`, `redaction.masked.count`), never the names or values, so the Storefront RUM dashboard
  # can show when the browser leaked something the first layer should have caught.
  redaction/storefront:
    allow_all_keys: false
    allowed_keys:
      # resource (storefront SDK)
      - service.name
      - service.version
      - telemetry.sdk.name
      - telemetry.sdk.language
      - telemetry.sdk.version
      - session.id
      - correlation.id
      # route template, never a URL
      - http.route
      - page.route
      # method and status of platform calls (stable and legacy semantic convention names)
      - http.request.method
      - http.method
      - http.response.status_code
      - http.status_code
      # interactions: kind, ARIA role and developer-assigned id, never text or values
      - interaction.kind
      - element.role
      - element.id
      # timings and errors: class or problem type slug, never a message
      - duration.ms
      - exception.type
      - error.type
      - error.name
    blocked_values:
      # email addresses
      - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
      # JWT-looking tokens
      - 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
      # cookie-like strings (session, cart token, __Host- prefixed cookies)
      - 'session=|cart=|__Host-'
    summary: info

connectors:
  # One connector per signal (a pipeline list is signal-typed). Default context is the resource: the condition reads
  # the resource attributes of each ResourceSpans/ResourceLogs; everything else keeps the services' path unchanged.
  routing/traces:
    error_mode: ignore
    default_pipelines: [traces/services]
    table:
      - condition: attributes["service.name"] == "storefront"
        pipelines: [traces/storefront]
  routing/logs:
    error_mode: ignore
    default_pipelines: [logs/services]
    table:
      - condition: attributes["service.name"] == "storefront"
        pipelines: [logs/storefront]

exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    # Logs: receive, route by service.name, then the services' chain (unchanged) or the storefront chain
    # (attribute deletion and allow-list first, then the same labels and batching as the services).
    logs/in:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [routing/logs]
    logs/services:
      receivers: [routing/logs]
      processors: [transform/logs, groupbyattrs/level, batch]
      exporters: [otlp_http/loki]
    logs/storefront:
      receivers: [routing/logs]
      processors: [attributes/storefront, redaction/storefront, transform/logs, groupbyattrs/level, batch]
      exporters: [otlp_http/loki]
    # Traces: same split.
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [routing/traces]
    traces/services:
      receivers: [routing/traces]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    traces/storefront:
      receivers: [routing/traces]
      processors: [attributes/storefront, redaction/storefront, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    metrics:
      level: basic
