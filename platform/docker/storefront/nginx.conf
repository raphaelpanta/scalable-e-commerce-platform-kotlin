# Storefront static server (feature 005, research section 7; specs/005-storefront-dev-bootstrap/contracts/gateway-routes.md,
# "Storefront route caching and security headers"). Replaces /etc/nginx/conf.d/default.conf of nginxinc/nginx-unprivileged;
# the image's own nginx.conf (worker processes, pid and temp paths under /tmp, mime types, access log) stays in place.
#
# Behaviour:
#   - /healthz answers 200 "ok" for the image HEALTHCHECK, the Compose health check and .github/scripts/image-health.sh;
#   - /assets/* are the hashed Vite bundles: served as is, one year immutable, 404 when missing;
#   - any other path whose last segment has a file extension (/favicon.ico, /robots.txt, /x/y.js) is a real file or 404,
#     never the SPA shell, so the gateway can pass the 404 through;
#   - everything else (/, /products/123, an unknown deep link) is the SPA shell, index.html, with Cache-Control: no-store
#     so a new deployment is picked up at the next navigation; the storefront renders its own not-found page.
# Security headers (CSP, X-Frame-Options, Referrer-Policy, ...) are NOT set here: the gateway owns them for the
# storefront route (EdgeHeaders), and this container is reachable only through it (network `internal`).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed text responses (text/html is always included by nginx).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundles (assets/[name]-[hash].ext, frontend/vite.config.ts): a new build changes the file name, never its content.
    # `^~` stops nginx from also trying the regex location below, which would win and drop this header.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA shell: served for / and for every extension-less path (internal redirect from `location /`), never cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Paths whose last segment has a file extension are files: present, or 404 (no fallback to the shell).
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
