# Test-only overrides, loaded on top of the main application.yml. Spring's test context cache closes the
# application in a JVM shutdown hook, after Gradle stops capturing test output; keep that shutdown quiet.
logging:
  level:
    # Testcontainers' Docker client retries dropped socket responses at INFO (Podman shim); not a test signal
    com.github.dockerjava: warn
    org.springframework.boot.reactor.netty.GracefulShutdown: warn
    # Testcontainers stops the database while R2DBC connections are still open; the resulting "Connection
    # reset" is expected at shutdown and would otherwise print at ERROR level (Principle VIII).
    io.r2dbc.postgresql.client.ReactorNettyClient: off

management:
  # No collector in tests: the OTLP exporters of platform-core's defaults (metrics, traces and the log records of
  # the OTEL Logback appender) stay off.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
