# Per-service pipeline (feature 004, user story 9, FR-028, SC-009): the quality gate, the contract flow, the
# dependency scan and the container image of ONE service. Reusable (workflow_call); each service has a thin caller
# (.github/workflows/<ctx>.yml) with `paths:` filters, so a change confined to one service runs only that pipeline.
# Documentation: docs/ci-cd.md, runner and registry: platform/ci-runner/README.md.
#
# Jobs (gate bounded by timeout-minutes: 30 for cache-cold runs, the others by 15; `gate` and `jar` start together, `image` follows `jar`, `publish` joins both):
#   gate    ./gradlew -q check of the service modules (ktlint, detekt, test layers, architecture rules, Pitest with
#           its threshold), then the Pact flow against the broker when PACT_BROKER_URL is configured (publish pacts,
#           provider verification with result publication, the providers' verification of this service's pacts at the
#           same commit, can-i-deploy), then the dependency scan (osv-scanner)
#   jar     ./gradlew bootJar of the service, handed over as the artifact jar-<svc> (no tests: the Docker build copies it
#           instead of compiling a second time, build-arg APP_JAR of platform/docker/Dockerfile)
#   image   docker build with that jar, Trivy image scan (fails on CRITICAL), CycloneDX SBOM (syft), start-and-health
#           (the image boots next to a postgres sidecar and reports UP on /actuator/health/readiness within 90 s)
#   publish on pushes to main only, after gate AND image succeeded: push of <REGISTRY_HOST>/<service>:<sha> and :<branch>
#           to the private registry (the image stays in the runners' shared engine, or travels from `image` as the
#           artifact image-<svc> when the repository variable IMAGE_HANDOVER=artifact)
#   <svc>   aggregate named after the service; the check `service-ci / <svc>` of the caller job is this one and it
#           fails unless gate and image succeeded and publish succeeded or was skipped (a skipped gate or image, e.g. a
#           fork pull request, is a failure)
#
# Safeguards (specs/004-ecommerce-platform-mvp/research.md section 4): read-only token, no pull_request_target, every
# `uses:` pinned to a full commit SHA (trailing comment = release), fork pull requests never run on the self-hosted
# runner (job guard; also set "Require approval for all outside collaborators"), secrets reach only the steps that
# need them (never the Gradle build), expressions with attacker-controlled values go through `env:`, never into `run:`.
# Tool images are pinned by tag and digest (docs/ci-cd.md, "Updating pinned tools").
#
# Runner: containerised, ephemeral, labelled `ecommerce`, Docker socket mounted and the work directory mounted at the
# same path inside and outside the container, so `docker run -v "$PWD:$PWD"` works (platform/ci-runner/README.md).
# The runner uses the host network, hence `localhost` reaches the registry and the Pact Broker published on the host.
name: service-ci

on:
  workflow_call:
    inputs:
      service:
        description: gateway, identity, catalog, cart, order, payment or notification
        type: string
        required: true
      publish-image:
        description: Push the image to the private registry (honoured only on pushes to main)
        type: boolean
        default: true
      reason:
        description: Why the pipeline runs (the caller's event, or the reason of a workflow_dispatch from a Pact Broker webhook)
        type: string
        default: ''
      pact-url:
        description: Pact Broker URL of the one pact a webhook-triggered run verifies (PACT_URL); empty for the usual selectors
        type: string
        default: ''
      consumer:
        description: Consumer of that pact (PACT_CONSUMER)
        type: string
        default: ''
    secrets:
      REGISTRY_USERNAME:
        description: Basic-auth user of the private registry (image push)
        required: false
      REGISTRY_PASSWORD:
        description: Basic-auth password of the private registry (image push)
        required: false
      PACT_BROKER_URL:
        description: Base URL of the Pact Broker; without it the broker steps are skipped
        required: false
      PACT_BROKER_USERNAME:
        required: false
      PACT_BROKER_PASSWORD:
        required: false

permissions:
  contents: read

# One run per service and ref; pull-request runs are superseded by a newer push, main runs (image publication) never.
concurrency:
  group: service-ci-${{ inputs.service }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool containers (run through the runner's Docker socket); refresh deliberately, see docs/ci-cd.md.
  PACT_CLI_IMAGE: pactfoundation/pact-cli:1.5.0.5@sha256:77b98079e5be279353f61e116a0b9b3af19e55b215532b30d430ff5df66e5ac9
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  SYFT_IMAGE: anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c

jobs:
  gate:
    name: gate (${{ inputs.service }})
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the Gradle modules of the service
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway)
              modules=":services:gateway"
              check=":services:gateway:check"
              verify=":services:gateway:contractVerify"
              ;;
            identity | catalog | cart | order | payment | notification)
              modules=":services:$SERVICE:infrastructure"
              check=":services:$SERVICE:domain:check :services:$SERVICE:application:check :services:$SERVICE:infrastructure:check"
              verify=":services:$SERVICE:infrastructure:contractVerify"
              ;;
            *)
              echo "::error::unknown service '$SERVICE' (gateway, identity, catalog, cart, order, payment, notification)"
              exit 1
              ;;
          esac
          {
            echo "SERVICE_MODULE=$modules"
            echo "CHECK_TASKS=$check"
            echo "VERIFY_TASK=$verify"
            echo "DEPENDENCIES_TASK=$modules:dependencies"
          } >> "$GITHUB_ENV"

      - name: Set up JDK from .java-version
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version

      # Also validates every gradle-wrapper.jar against the published checksums (validate-wrappers defaults to true).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # GRADLE_USER_HOME (dependencies, wrapper, local build cache) already lives on the runner's own disk
          # (platform/ci-runner): restoring and saving it through the GitHub cache service would only cost time.
          cache-disabled: true
          validate-wrappers: true

      - name: Keep the Gradle configuration cache on the runner
        run: .github/scripts/ci-cache.sh gradle

      # check = ktlint, detekt, unit, integration, contract (consumer + provider with @PactFolder), acceptance and
      # architecture layers, and Pitest with its 80 % threshold for domain and application. Pitest is part of check:
      # it is not run a second time. No secret is exposed to the build.
      - name: Gradle check of the service modules
        run: |
          read -ra tasks <<< "$CHECK_TASKS"
          ./gradlew -q "${tasks[@]}"

      # Secrets are not usable in `if:`; the step only records whether a broker is configured. Inputs reach the shell
      # through env: only (a dispatched run's reason and pact URL are free text).
      - name: Detect the Pact Broker
        id: pact
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          REASON: ${{ inputs.reason }}
          PACT_URL: ${{ inputs.pact-url }}
          PACT_CONSUMER: ${{ inputs.consumer }}
        run: |
          {
            echo "Trigger: ${REASON:-$GITHUB_EVENT_NAME}"
            [ -z "$PACT_URL" ] || echo "Pact to verify: $PACT_URL (consumer ${PACT_CONSUMER:-unknown})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PACT_BROKER_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PACT_BROKER_URL is not configured: pact publication, broker verification and can-i-deploy are skipped"
          fi

      # The pacts written by this service's contractTest live in the repository root build/pacts, named
      # <consumer>-<provider>.json: the ones it consumes (<svc>-*.json) and the platform probe's health pact of this
      # provider (platform-probe-<svc>.json). Only those are published, with the commit SHA as consumer version, the
      # branch and the run URL; publishing a changed pact fires the broker's contract_content_changed webhook, which
      # dispatches the provider's pipeline (platform/ci-runner/README.md "Pact Broker webhooks").
      - name: Publish the consumer pacts to the Pact Broker
        if: steps.pact.outputs.enabled == 'true'
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pacts=(build/pacts/"$SERVICE"-*.json build/pacts/platform-probe-"$SERVICE".json)
          if [ "${#pacts[@]}" -eq 0 ]; then
            echo "::notice::$SERVICE wrote no consumer pact to build/pacts: nothing to publish"
            exit 0
          fi
          files=()
          for pact in "${pacts[@]}"; do files+=("$PWD/$pact"); done
          creds=()
          [ -z "$PACT_BROKER_USERNAME" ] || creds+=(-e PACT_BROKER_USERNAME -e PACT_BROKER_PASSWORD)
          docker run --rm --network host -w "$PWD" -v "$PWD:$PWD" -e PACT_BROKER_BASE_URL "${creds[@]}" \
            "$PACT_CLI_IMAGE" publish "${files[@]}" \
            --consumer-app-version "$GITHUB_SHA" --branch "$PACT_BRANCH" \
            --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Provider side against the broker: with PACT_BROKER_URL the build passes pactbroker.url and the credentials
      # (docs/build.md, "Contract tests"), so the <Ctx>BrokerVerificationTest classes run next to the file-based ones:
      # they fetch the pacts of the consumer versions on main, deployed or released and on this branch, or only the
      # pact a webhook named (PACT_URL, PACT_CONSUMER), and publish the results for pact.provider.version = GITHUB_SHA
      # on branch PACT_PROVIDER_BRANCH. A broken contract fails here, naming the consumer and the interaction.
      - name: Verify the provider contracts and publish the results
        if: steps.pact.outputs.enabled == 'true'
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_PUBLISH_RESULTS: "true"
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
          PACT_URL: ${{ inputs.pact-url }}
          PACT_CONSUMER: ${{ inputs.consumer }}
        run: ./gradlew -q "$VERIFY_TASK"

      # The consumer side of the same question: can-i-deploy (next step) needs the providers of this service's pacts to
      # have verified them. In this monorepo those providers are built from the same commit, so their broker
      # verification runs here, restricted to this service's pacts (PACT_CONSUMER), and publishes results for provider
      # version GITHUB_SHA. Waiting for the providers' own pipelines does not work on one Gradle runner: they queue
      # behind this job, and can-i-deploy ran out of retries with "no such version exists". A webhook-dispatched run
      # (PACT_URL) verifies only the pact it was dispatched for, as the provider, and skips this step.
      - name: Verify this service's pacts at their providers
        if: steps.pact.outputs.enabled == 'true' && inputs.pact-url == ''
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_PUBLISH_RESULTS: "true"
          PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
          PACT_CONSUMER: ${{ inputs.service }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tasks=()
          for pact in build/pacts/"$SERVICE"-*.json; do
            provider="$(basename "$pact" .json)"
            provider="${provider#"$SERVICE"-}"
            case "$provider" in
              gateway) tasks+=(":services:gateway:contractVerify") ;;
              identity | catalog | cart | order | payment | notification) tasks+=(":services:$provider:infrastructure:contractVerify") ;;
              *) echo "::warning::$pact names no provider module of this repository; its provider verifies it in its own pipeline" ;;
            esac
          done
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::notice::$SERVICE consumes no provider of this repository"
            exit 0
          fi
          ./gradlew -q "${tasks[@]}"

      # Fails the job, naming the pact and the consumer or provider involved, when this version is not compatible with
      # the versions it integrates with. A consumer's new pact is verified by the provider pipeline the webhook
      # dispatched, so the check waits while results are unknown: PACT_CAN_I_DEPLOY_RETRIES (repository variable,
      # default 24) polls every 10 s, 4 minutes by default, within the job's 15-minute bound. PACT_ENVIRONMENT
      # (optional) restricts the check to the versions deployed to that environment; PACT_CAN_I_DEPLOY=false switches
      # the check off.
      - name: Can I deploy?
        if: steps.pact.outputs.enabled == 'true' && vars.PACT_CAN_I_DEPLOY != 'false'
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_ENVIRONMENT: ${{ vars.PACT_ENVIRONMENT }}
          RETRIES: ${{ vars.PACT_CAN_I_DEPLOY_RETRIES || '24' }}
        run: |
          set -euo pipefail
          case "$RETRIES" in '' | *[!0-9]*) echo "::error::PACT_CAN_I_DEPLOY_RETRIES must be a number"; exit 1 ;; esac
          creds=()
          [ -z "$PACT_BROKER_USERNAME" ] || creds+=(-e PACT_BROKER_USERNAME -e PACT_BROKER_PASSWORD)
          target=()
          [ -z "$PACT_ENVIRONMENT" ] || target+=(--to-environment "$PACT_ENVIRONMENT")
          docker run --rm --network host -e PACT_BROKER_BASE_URL "${creds[@]}" "$PACT_CLI_IMAGE" \
            pact-broker can-i-deploy --pacticipant "$SERVICE" --version "$GITHUB_SHA" "${target[@]}" \
            --retry-while-unknown "$RETRIES" --retry-interval 10

      # Dependency scan: the resolved runtime classpath of the deployable module is converted to a Gradle lockfile
      # (the build does not use dependency locking) and checked against OSV by osv-scanner. Any known vulnerability
      # fails the step; the repository variable DEPENDENCY_SCAN_ENFORCE=false turns findings into annotations only.
      - name: Dependency scan (osv-scanner)
        continue-on-error: ${{ vars.DEPENDENCY_SCAN_ENFORCE == 'false' }}
        run: |
          set -euo pipefail
          mkdir -p ci-out
          ./gradlew -q "$DEPENDENCIES_TASK" --configuration runtimeClasspath > ci-out/dependencies.txt
          .github/scripts/gradle-deps-to-lockfile.sh ci-out/dependencies.txt > ci-out/gradle.lockfile
          [ "$(wc -l < ci-out/gradle.lockfile)" -gt 1 ] || { echo "::error::no dependency resolved for $DEPENDENCIES_TASK"; exit 1; }
          # The image's entrypoint lives in /root: the container must run as root, so the input is mounted read-only.
          docker run --rm -v "$PWD/ci-out:/src:ro" "$OSV_SCANNER_IMAGE" \
            scan source --lockfile /src/gradle.lockfile --format table

      - name: Upload the dependency list
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependencies-${{ inputs.service }}
          retention-days: 7
          if-no-files-found: ignore
          path: ci-out/

      # Paths are kept by archiving: an upload of several modules' files would strip their common prefix.
      - name: Pack the test and Pitest reports
        if: failure()
        run: >-
          find . -path ./build-logic -prune -o \( -path '*/build/reports/*' -o -path '*/build/test-results/*'
          -o -path '*/build/pitest/stderr.log' \) -type f -print | tar -cf service-reports.tar -T -

      - name: Upload the test and Pitest reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ inputs.service }}
          retention-days: 7
          if-no-files-found: ignore
          path: service-reports.tar

  # Compiles the service once for the image: the Docker build copies this jar instead of running Gradle again
  # (platform/docker/Dockerfile, build-arg APP_JAR). Independent of `gate`, so both run at the same time when the runner
  # pool has room for two jobs.
  jar:
    name: jar (${{ inputs.service }})
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK from .java-version
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # GRADLE_USER_HOME (dependencies, wrapper, local build cache) already lives on the runner's own disk
          # (platform/ci-runner): restoring and saving it through the GitHub cache service would only cost time.
          cache-disabled: true
          validate-wrappers: true

      - name: Keep the Gradle configuration cache on the runner
        run: .github/scripts/ci-cache.sh gradle

      - name: Build the boot jar
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway) module=":services:gateway" ;;
            identity | catalog | cart | order | payment | notification) module=":services:$SERVICE:infrastructure" ;;
            *) echo "::error::unknown service '$SERVICE'"; exit 1 ;;
          esac
          ./gradlew -q "$module:bootJar"
          module_dir="$(echo "$module" | sed 's#^:##; s#:#/#g')"
          mkdir -p ci-jar
          find "$module_dir/build/libs" -name '*.jar' ! -name '*-plain.jar' -exec cp {} ci-jar/app.jar \;
          test -s ci-jar/app.jar

      # Short-lived hand-over to the image job; not a release artifact.
      - name: Upload the boot jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jar-${{ inputs.service }}
          retention-days: 1
          if-no-files-found: error
          path: ci-jar/app.jar

  # Light runner (platform/ci-runner, `runner-light`): the job drives the engine through the socket (docker build, Trivy,
  # syft, the health check), so it runs next to the Gradle jobs of the main runner instead of queueing behind them.
  image:
    name: image (${{ inputs.service }})
    needs: jar
    runs-on: [self-hosted, linux, ecommerce-light]
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    env:
      SERVICE: ${{ inputs.service }}
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      # Podman engines drop HEALTHCHECK from OCI images; BuildKit is needed for the Gradle cache mount.
      BUILDAH_FORMAT: docker
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the boot jar of the jar job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jar-${{ inputs.service }}
          path: ci-jar

      - name: Resolve the image coordinates
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway | identity | catalog | cart | order | payment | notification) ;;
            *) echo "::error::unknown service '$SERVICE'"; exit 1 ;;
          esac
          branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-120)"
          repo="${REGISTRY_HOST:+$REGISTRY_HOST/}$SERVICE"
          {
            echo "IMAGE_REPO=$repo"
            echo "IMAGE_SHA=$repo:$GITHUB_SHA"
            echo "IMAGE_BRANCH=$repo:${branch:-unknown}"
          } >> "$GITHUB_ENV"

      # APP_JAR makes the build stage copy the jar of the jar job instead of compiling again; SERVICE_MODULE is kept so
      # that the same command without APP_JAR still builds from source (docs/ci-cd.md, "Parallel jobs and the jar").
      - name: Build the image
        id: build
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway) module=":services:gateway" ;;
            *) module=":services:$SERVICE:infrastructure" ;;
          esac
          # --load: with a BuildKit builder of the docker-container driver (what buildx sets up next to a Podman engine)
          # the image would otherwise stay in the build cache, and Trivy, syft and the health check would not find it.
          docker build --load -f platform/docker/Dockerfile --build-arg "SERVICE_MODULE=$module" --build-arg APP_JAR=ci-jar/app.jar \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE_SHA" -t "$IMAGE_BRANCH" .
          echo "image-id=$(docker image inspect --format '{{.Id}}' "$IMAGE_SHA")" >> "$GITHUB_OUTPUT"

      # Fails on CRITICAL vulnerabilities that have a fix; the image is scanned before it is pushed.
      # label=disable: Trivy and syft read the image through the engine socket, which SELinux (Fedora CoreOS under podman
      # machine) keeps a confined container from opening, as for the runners themselves (platform/ci-runner/README.md).
      - name: Image scan (Trivy)
        run: |
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE_SHA"

      # The image SBOM satisfies the SBOM requirement (T116); a Gradle CycloneDX task is deferred (docs/ci-cd.md).
      - name: Generate the SBOM (syft, CycloneDX)
        run: |
          mkdir -p ci-out
          docker run --rm --security-opt label=disable -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/ci-out:/out" "$SYFT_IMAGE" \
            scan "docker:$IMAGE_SHA" -o "cyclonedx-json=/out/$SERVICE.cdx.json" -q

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.service }}
          retention-days: 30
          if-no-files-found: ignore
          path: ci-out/*.cdx.json

      # US9/AC3: the image must boot and report UP. The service runs with throw-away credentials next to a postgres
      # sidecar (none for the gateway), is probed from inside the container for up to 90 s, and is always stopped; the
      # last log lines are printed on failure (.github/scripts/image-health.sh, docs/ci-cd.md "Start-and-health check").
      - name: Start the image and wait for /actuator/health/readiness
        env:
          HEALTH_TIMEOUT: "90"
        run: .github/scripts/image-health.sh "$SERVICE" "$IMAGE_SHA"

      # Hand-over to the publish job, only when a push to main will publish: the image that was scanned and started is
      # the image that is pushed (the publish job checks its ID). The runners of platform/ci-runner share one engine, so
      # by default the image simply stays in it; with the repository variable IMAGE_HANDOVER=artifact (runners on
      # several engines) it travels as the artifact image-<svc> instead (save, upload, download, load).
      - name: Save the image for the publish job
        if: inputs.publish-image && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IMAGE_HANDOVER == 'artifact'
        run: docker save -o ci-image.tar "$IMAGE_SHA" "$IMAGE_BRANCH"

      - name: Upload the image for the publish job
        if: inputs.publish-image && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IMAGE_HANDOVER == 'artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ inputs.service }}
          retention-days: 1
          if-no-files-found: error
          path: ci-image.tar

      # Every pull-request run would otherwise leave an image of a few hundred MB in the engine; the image that the
      # publish job takes from the engine is removed by the aggregate job, after the push.
      - name: Remove the image from the engine
        if: always() && !(inputs.publish-image && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IMAGE_HANDOVER != 'artifact')
        run: docker rmi "$IMAGE_SHA" "$IMAGE_BRANCH" >/dev/null 2>&1 || true

  # Pushes the image that `image` built, scanned and started, once `gate` AND `image` have succeeded. Runs on pushes to
  # main only (skipped otherwise, which the aggregate accepts). The registry credentials exist only in this job's step.
  publish:
    name: publish (${{ inputs.service }})
    needs: [gate, image]
    runs-on: [self-hosted, linux, ecommerce-light]
    timeout-minutes: 15
    if: >-
      inputs.publish-image && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success' && needs.image.result == 'success'
    env:
      SERVICE: ${{ inputs.service }}
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
    steps:
      - name: Download the image
        if: vars.IMAGE_HANDOVER == 'artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ inputs.service }}

      - name: Load the image
        if: vars.IMAGE_HANDOVER == 'artifact'
        run: docker load -i ci-image.tar

      # The image must be the one the image job built, scanned and started (same ID), whether it stayed in the engine
      # or came back from the artifact.
      - name: Check the image against the image job
        env:
          IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          set -euo pipefail
          image="${REGISTRY_HOST:+$REGISTRY_HOST/}$SERVICE:$GITHUB_SHA"
          actual="$(docker image inspect --format '{{.Id}}' "$image" 2>/dev/null)" ||
            { echo "::error::$image is not in this runner's engine (runners on several engines: set the repository variable IMAGE_HANDOVER=artifact)"; exit 1; }
          [ "$actual" = "$IMAGE_ID" ] || { echo "::error::$image is $actual, not the image $IMAGE_ID the image job scanned"; exit 1; }

      # The credentials exist only in this step and in a throw-away Docker config directory.
      - name: Push the image to the private registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY_HOST" ] || [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning::REGISTRY_HOST (variable) or REGISTRY_USERNAME / REGISTRY_PASSWORD (secrets) are not configured: the image was built and scanned but not pushed"
            exit 0
          fi
          branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-120)"
          image_sha="$REGISTRY_HOST/$SERVICE:$GITHUB_SHA"
          image_branch="$REGISTRY_HOST/$SERVICE:${branch:-unknown}"
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'docker logout "$REGISTRY_HOST" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          docker push "$image_sha"
          docker push "$image_branch"
          echo "Pushed \`$image_sha\` and \`$image_branch\`" >> "$GITHUB_STEP_SUMMARY"

  # The required status check of the caller job: `service-ci / <service>`.
  result:
    name: ${{ inputs.service }}
    needs: [gate, image, publish]
    if: always()
    runs-on: [self-hosted, linux, ecommerce-light]
    timeout-minutes: 5
    steps:
      - name: Require gate and image to have succeeded (publish too when it ran)
        env:
          GATE: ${{ needs.gate.result }}
          IMAGE: ${{ needs.image.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          echo "gate: $GATE, image: $IMAGE, publish: $PUBLISH"
          [ "$GATE" = success ] && [ "$IMAGE" = success ] && { [ "$PUBLISH" = success ] || [ "$PUBLISH" = skipped ]; }

      # The image of a push to main stays in the engine for the publish job; it is removed here once that job is over
      # (pushed, failed or skipped).
      - name: Remove the image from the engine
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IMAGE_HANDOVER != 'artifact'
        env:
          SERVICE: ${{ inputs.service }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-120)"
          repo="${REGISTRY_HOST:+$REGISTRY_HOST/}$SERVICE"
          docker rmi "$repo:$GITHUB_SHA" "$repo:${branch:-unknown}" >/dev/null 2>&1 || true
