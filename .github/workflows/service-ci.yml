# Per-service pipeline (feature 004, user story 9, FR-028, SC-009): the quality gate, the contract flow, the
# dependency scan and the container image of ONE service. Reusable (workflow_call); each service has a thin caller
# (.github/workflows/<ctx>.yml) with `paths:` filters, so a change confined to one service runs only that pipeline.
# Documentation: docs/ci-cd.md, runner and registry: platform/ci-runner/README.md.
#
# Jobs (each bounded by timeout-minutes: 15):
#   gate    ./gradlew -q check of the service modules (ktlint, detekt, test layers, architecture rules, Pitest with
#           its threshold), then the Pact flow against the broker when PACT_BROKER_URL is configured (publish pacts,
#           provider verification with result publication, can-i-deploy), then the dependency scan (osv-scanner)
#   image   docker build of platform/docker/Dockerfile, Trivy image scan (fails on CRITICAL), CycloneDX SBOM (syft)
#           and, on pushes to main only, push of <REGISTRY_HOST>/<service>:<sha> and :<branch> to the private registry
#   <svc>   aggregate named after the service; the check `service-ci / <svc>` of the caller job is this one and it
#           fails unless gate and image both succeeded (a skipped job, e.g. a fork pull request, is a failure)
#
# Safeguards (specs/004-ecommerce-platform-mvp/research.md section 4): read-only token, no pull_request_target, every
# `uses:` pinned to a full commit SHA (trailing comment = release), fork pull requests never run on the self-hosted
# runner (job guard; also set "Require approval for all outside collaborators"), secrets reach only the steps that
# need them (never the Gradle build), expressions with attacker-controlled values go through `env:`, never into `run:`.
# Tool images are pinned by tag and digest (docs/ci-cd.md, "Updating pinned tools").
#
# Runner: containerised, ephemeral, labelled `ecommerce`, Docker socket mounted and the work directory mounted at the
# same path inside and outside the container, so `docker run -v "$PWD:$PWD"` works (platform/ci-runner/README.md).
# The runner uses the host network, hence `localhost` reaches the registry and the Pact Broker published on the host.
name: service-ci

on:
  workflow_call:
    inputs:
      service:
        description: gateway, identity, catalog, cart, order, payment or notification
        type: string
        required: true
      publish-image:
        description: Push the image to the private registry (honoured only on pushes to main)
        type: boolean
        default: true
    secrets:
      REGISTRY_USERNAME:
        description: Basic-auth user of the private registry (image push)
        required: false
      REGISTRY_PASSWORD:
        description: Basic-auth password of the private registry (image push)
        required: false
      PACT_BROKER_URL:
        description: Base URL of the Pact Broker; without it the broker steps are skipped
        required: false
      PACT_BROKER_USERNAME:
        required: false
      PACT_BROKER_PASSWORD:
        required: false

permissions:
  contents: read

# One run per service and ref; pull-request runs are superseded by a newer push, main runs (image publication) never.
concurrency:
  group: service-ci-${{ inputs.service }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool containers (run through the runner's Docker socket); refresh deliberately, see docs/ci-cd.md.
  PACT_CLI_IMAGE: pactfoundation/pact-cli:1.5.0.5@sha256:77b98079e5be279353f61e116a0b9b3af19e55b215532b30d430ff5df66e5ac9
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  SYFT_IMAGE: anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c

jobs:
  gate:
    name: gate (${{ inputs.service }})
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SERVICE: ${{ inputs.service }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the Gradle modules of the service
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway)
              modules=":services:gateway"
              check=":services:gateway:check"
              verify=":services:gateway:contractVerify"
              ;;
            identity | catalog | cart | order | payment | notification)
              modules=":services:$SERVICE:infrastructure"
              check=":services:$SERVICE:domain:check :services:$SERVICE:application:check :services:$SERVICE:infrastructure:check"
              verify=":services:$SERVICE:infrastructure:contractVerify"
              ;;
            *)
              echo "::error::unknown service '$SERVICE' (gateway, identity, catalog, cart, order, payment, notification)"
              exit 1
              ;;
          esac
          {
            echo "SERVICE_MODULE=$modules"
            echo "CHECK_TASKS=$check"
            echo "VERIFY_TASK=$verify"
            echo "DEPENDENCIES_TASK=$modules:dependencies"
          } >> "$GITHUB_ENV"

      - name: Set up JDK from .java-version
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version

      # Also validates every gradle-wrapper.jar against the published checksums (validate-wrappers defaults to true).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      # check = ktlint, detekt, unit, integration, contract (consumer + provider with @PactFolder), acceptance and
      # architecture layers, and Pitest with its 80 % threshold for domain and application. Pitest is part of check:
      # it is not run a second time. No secret is exposed to the build.
      - name: Gradle check of the service modules
        run: |
          read -ra tasks <<< "$CHECK_TASKS"
          ./gradlew -q "${tasks[@]}"

      # Secrets are not usable in `if:`; the step only records whether a broker is configured.
      - name: Detect the Pact Broker
        id: pact
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
        run: |
          if [ -n "$PACT_BROKER_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PACT_BROKER_URL is not configured: pact publication, broker verification and can-i-deploy are skipped"
          fi

      # The pacts written by contractTest (consumer side) live in the repository root build/pacts. A service that is
      # only a provider has none: nothing to publish.
      - name: Publish the consumer pacts to the Pact Broker
        if: steps.pact.outputs.enabled == 'true'
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if ! find build/pacts -name '*.json' 2>/dev/null | grep -q .; then
            echo "::notice::$SERVICE wrote no consumer pact (build/pacts is empty): nothing to publish"
            exit 0
          fi
          creds=()
          [ -z "$PACT_BROKER_USERNAME" ] || creds+=(-e PACT_BROKER_USERNAME -e PACT_BROKER_PASSWORD)
          docker run --rm --network host -w "$PWD" -v "$PWD:$PWD" -e PACT_BROKER_BASE_URL "${creds[@]}" \
            "$PACT_CLI_IMAGE" publish "$PWD/build/pacts" \
            --consumer-app-version "$GITHUB_SHA" --branch "$PACT_BRANCH"

      # Provider side against the broker: the build reads PACT_BROKER_URL and the credentials (docs/build.md,
      # "Contract tests"), sets pact.provider.version to GITHUB_SHA and publishes the results. Without a broker the
      # file-based verification of `check` above has already run.
      - name: Verify the provider contracts and publish the results
        if: steps.pact.outputs.enabled == 'true'
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_PUBLISH_RESULTS: "true"
        run: ./gradlew -q "$VERIFY_TASK"

      # Fails the job, naming the pact and the consumer or provider involved, when this version is not compatible with
      # the versions it integrates with. PACT_ENVIRONMENT (repository variable, optional) restricts the check to the
      # versions deployed to that environment; PACT_CAN_I_DEPLOY=false switches the check off.
      - name: Can I deploy?
        if: steps.pact.outputs.enabled == 'true' && vars.PACT_CAN_I_DEPLOY != 'false'
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_ENVIRONMENT: ${{ vars.PACT_ENVIRONMENT }}
        run: |
          set -euo pipefail
          creds=()
          [ -z "$PACT_BROKER_USERNAME" ] || creds+=(-e PACT_BROKER_USERNAME -e PACT_BROKER_PASSWORD)
          target=()
          [ -z "$PACT_ENVIRONMENT" ] || target+=(--to-environment "$PACT_ENVIRONMENT")
          docker run --rm --network host -e PACT_BROKER_BASE_URL "${creds[@]}" "$PACT_CLI_IMAGE" \
            pact-broker can-i-deploy --pacticipant "$SERVICE" --version "$GITHUB_SHA" "${target[@]}" \
            --retry-while-unknown 6 --retry-interval 10

      # Dependency scan: the resolved runtime classpath of the deployable module is converted to a Gradle lockfile
      # (the build does not use dependency locking) and checked against OSV by osv-scanner. Any known vulnerability
      # fails the step; the repository variable DEPENDENCY_SCAN_ENFORCE=false turns findings into annotations only.
      - name: Dependency scan (osv-scanner)
        continue-on-error: ${{ vars.DEPENDENCY_SCAN_ENFORCE == 'false' }}
        run: |
          set -euo pipefail
          mkdir -p ci-out
          ./gradlew -q "$DEPENDENCIES_TASK" --configuration runtimeClasspath > ci-out/dependencies.txt
          .github/scripts/gradle-deps-to-lockfile.sh ci-out/dependencies.txt > ci-out/gradle.lockfile
          [ "$(wc -l < ci-out/gradle.lockfile)" -gt 1 ] || { echo "::error::no dependency resolved for $DEPENDENCIES_TASK"; exit 1; }
          # The image's entrypoint lives in /root: the container must run as root, so the input is mounted read-only.
          docker run --rm -v "$PWD/ci-out:/src:ro" "$OSV_SCANNER_IMAGE" \
            scan source --lockfile /src/gradle.lockfile --format table

      - name: Upload the dependency list
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependencies-${{ inputs.service }}
          retention-days: 7
          if-no-files-found: ignore
          path: ci-out/

      # Paths are kept by archiving: an upload of several modules' files would strip their common prefix.
      - name: Pack the test and Pitest reports
        if: failure()
        run: >-
          find . -path ./build-logic -prune -o \( -path '*/build/reports/*' -o -path '*/build/test-results/*'
          -o -path '*/build/pitest/stderr.log' \) -type f -print | tar -cf service-reports.tar -T -

      - name: Upload the test and Pitest reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ inputs.service }}
          retention-days: 7
          if-no-files-found: ignore
          path: service-reports.tar

  image:
    name: image (${{ inputs.service }})
    needs: gate
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 15
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SERVICE: ${{ inputs.service }}
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      # Podman engines drop HEALTHCHECK from OCI images; BuildKit is needed for the Gradle cache mount.
      BUILDAH_FORMAT: docker
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the image coordinates
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            gateway) module=":services:gateway" ;;
            identity | catalog | cart | order | payment | notification) module=":services:$SERVICE:infrastructure" ;;
            *) echo "::error::unknown service '$SERVICE'"; exit 1 ;;
          esac
          branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-120)"
          repo="${REGISTRY_HOST:+$REGISTRY_HOST/}$SERVICE"
          {
            echo "SERVICE_MODULE=$module"
            echo "IMAGE_REPO=$repo"
            echo "IMAGE_SHA=$repo:$GITHUB_SHA"
            echo "IMAGE_BRANCH=$repo:${branch:-unknown}"
          } >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          docker build -f platform/docker/Dockerfile --build-arg "SERVICE_MODULE=$SERVICE_MODULE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE_SHA" -t "$IMAGE_BRANCH" .

      # Fails on CRITICAL vulnerabilities that have a fix; the image is scanned before it is pushed.
      - name: Image scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE_SHA"

      - name: Generate the SBOM (syft, CycloneDX)
        run: |
          mkdir -p ci-out
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/ci-out:/out" "$SYFT_IMAGE" \
            scan "docker:$IMAGE_SHA" -o "cyclonedx-json=/out/$SERVICE.cdx.json" -q

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.service }}
          retention-days: 30
          if-no-files-found: ignore
          path: ci-out/*.cdx.json

      # The credentials exist only in this step and in a throw-away Docker config directory.
      - name: Push the image to the private registry
        if: inputs.publish-image && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY_HOST" ] || [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning::REGISTRY_HOST (variable) or REGISTRY_USERNAME / REGISTRY_PASSWORD (secrets) are not configured: the image was built and scanned but not pushed"
            exit 0
          fi
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'docker logout "$REGISTRY_HOST" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_BRANCH"
          echo "Pushed \`$IMAGE_SHA\` and \`$IMAGE_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

  # The required status check of the caller job: `service-ci / <service>`.
  result:
    name: ${{ inputs.service }}
    needs: [gate, image]
    if: always()
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 5
    steps:
      - name: Require gate and image to have succeeded
        env:
          GATE: ${{ needs.gate.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "gate: $GATE, image: $IMAGE"
          [ "$GATE" = success ] && [ "$IMAGE" = success ]
