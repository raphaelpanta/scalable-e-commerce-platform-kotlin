# Service pipeline of `catalog` (feature 004, user story 9): the `service-ci` reusable workflow runs the gate, the Pact
# flow, the scans and the image of this service only, and only when the service or something it is built from
# changes (`paths:`). Required status check: `service-ci / catalog` (docs/ci-cd.md). Pull requests from forks never run
# on the self-hosted runner (guard below, plus the repository setting "Require approval for all outside collaborators").
# The image is pushed to the private registry on pushes to main only. `workflow_dispatch` lets the Pact Broker re-run the
# pipeline when a consumer publishes a changed pact for this provider (webhook `contract_content_changed`,
# platform/ci-runner/README.md "Pact Broker webhooks"); the dispatched run verifies that pact and publishes the result.
name: catalog

on:
  push:
    branches: [main]
    paths:
      - 'services/catalog/**'
      - 'libs/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'contracts/**'
      - 'platform/docker/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'config/**'
      - '.github/workflows/service-ci.yml'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - 'services/catalog/**'
      - 'libs/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'contracts/**'
      - 'platform/docker/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'config/**'
      - '.github/workflows/service-ci.yml'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: Why the pipeline runs (set by the Pact Broker webhook, e.g. "contract_content_changed order 3f2a... on main")
        type: string
        required: false
        default: manual run
      pact-url:
        description: Pact Broker URL of the one pact to verify (empty verifies the usual consumer version selectors)
        type: string
        required: false
        default: ''
      consumer:
        description: Consumer of that pact (required with pact-url)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  service-ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/service-ci.yml
    with:
      service: catalog
      publish-image: ${{ github.event_name == 'push' }}
      reason: ${{ inputs.reason || github.event_name }}
      pact-url: ${{ inputs.pact-url || '' }}
      consumer: ${{ inputs.consumer || '' }}
    secrets: inherit
