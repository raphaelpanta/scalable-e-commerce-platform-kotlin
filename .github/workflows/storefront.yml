# Storefront pipeline (feature 005, T099): the quality gate, the contract flow, the dependency scan and the container
# image of the web storefront (`frontend/`), shaped like the service pipelines of feature 004 (`service-ci.yml`) but in one
# file, because the toolchain is Node, not Gradle. It runs only when the storefront or something it is built from changes
# (`paths:`). Required status check, through the path-neutral `services-aggregate` (docs/ci-cd.md): `service-ci / storefront`
# (the aggregate job below carries that name on purpose, so the check is named like the seven service checks). Pull
# requests from forks never run on the self-hosted runner (guards below, plus the repository setting "Require approval for
# all outside collaborators"). The image is pushed to the private registry on pushes to main only. The storefront is a Pact
# consumer only: nothing verifies it as a provider, so there are no webhook inputs; `workflow_dispatch` re-runs the pipeline.
#
# Jobs (each bounded by timeout-minutes: 15; `image` follows `gate`, `publish` follows both):
#   gate    Node 24, `npm ci`, `npm run lint` (prettier, eslint, tsc, generated types), `npm run test` (Vitest),
#           `npm run mutate` (Stryker, breaks below 80 %), `npm run pact` (consumer pacts to build/pacts/storefront-*.json),
#           then the Pact flow against the broker when PACT_BROKER_URL is configured (publish the pacts, can-i-deploy for
#           the pacticipant `storefront`), then the dependency scan (osv-scanner over frontend/package-lock.json)
#   image   docker build of platform/docker/Dockerfile.storefront, Trivy image scan (fails on CRITICAL), CycloneDX SBOM
#           (syft), start-and-health (nginx answers `ok` on /healthz within 90 s, .github/scripts/image-health.sh)
#   publish on pushes to main only, after gate AND image succeeded: push of <REGISTRY_HOST>/storefront:<sha> and :<branch>
#           to the private registry (the image travels from `image` as the artifact image-storefront)
#   result  the aggregate, named `service-ci / storefront`: fails unless gate and image succeeded and publish succeeded or
#           was skipped (a skipped gate or image, e.g. a fork pull request, is a failure)
#
# Safeguards as in service-ci.yml (specs/004-ecommerce-platform-mvp/research.md section 4): read-only token, no
# pull_request_target, every `uses:` pinned to a full commit SHA (trailing comment = release), secrets reach only the steps
# that need them (never the npm install or the tests), expressions with attacker-controlled values go through `env:`.
# Tool images are pinned by tag and digest (docs/ci-cd.md, "Updating pinned tools"); keep them identical to service-ci.yml.
#
# Runner: containerised, ephemeral, labelled `ecommerce`, Docker socket mounted, host network (platform/ci-runner/README.md).
name: storefront

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'platform/docker/Dockerfile.storefront'
      - 'platform/docker/storefront/**'
      - 'contracts/openapi/gateway-browser-session.yaml'
      - 'contracts/openapi/telemetry.yaml'
      - 'specs/004-ecommerce-platform-mvp/contracts/openapi/**'
      - 'specs/005-storefront-dev-bootstrap/contracts/openapi/**'
      - '.github/workflows/storefront.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'platform/docker/Dockerfile.storefront'
      - 'platform/docker/storefront/**'
      - 'contracts/openapi/gateway-browser-session.yaml'
      - 'contracts/openapi/telemetry.yaml'
      - 'specs/004-ecommerce-platform-mvp/contracts/openapi/**'
      - 'specs/005-storefront-dev-bootstrap/contracts/openapi/**'
      - '.github/workflows/storefront.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: Why the pipeline runs
        type: string
        required: false
        default: manual run

permissions:
  contents: read

# One run per ref; pull-request runs are superseded by a newer push, main runs (image publication) never.
concurrency:
  group: storefront-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool containers (run through the runner's Docker socket); the same pins as service-ci.yml, refresh them together.
  PACT_CLI_IMAGE: pactfoundation/pact-cli:1.5.0.5@sha256:77b98079e5be279353f61e116a0b9b3af19e55b215532b30d430ff5df66e5ac9
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  SYFT_IMAGE: anchore/syft:v1.54.0@sha256:0356562f495d432056237fbea5cbc2d4839c9c75cd500784a66de2e7cc95ca7c

jobs:
  gate:
    name: gate (storefront)
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 as frontend/.nvmrc and `engines` (engine-strict); the npm download cache is keyed by the lock file.
      - name: Set up Node from frontend/.nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm ci --silent --no-audit --no-fund

      # prettier --check, eslint --max-warnings 0, tsc --noEmit and the freshness of src/api/generated.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit and component tests (Vitest)
        working-directory: frontend
        run: npm run test

      # Stryker over src/domain, src/app and src/telemetry; thresholds.break is 80 (frontend/stryker.config.json). CI runs it
      # in full: the incremental file under build/ is not restored, so a surviving mutant cannot hide behind an old result.
      - name: Mutation tests (Stryker, break at 80 %)
        working-directory: frontend
        run: npm run mutate

      # One pact per provider (identity, catalog, cart, order, payment, gateway), written to the repository root
      # build/pacts/storefront-<provider>.json (docs/service-conventions.md section 6).
      - name: Pact consumer tests
        working-directory: frontend
        run: npm run pact

      # Secrets are not usable in `if:`; the step only records whether a broker is configured.
      - name: Detect the Pact Broker
        id: pact
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "Trigger: ${REASON:-$GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PACT_BROKER_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PACT_BROKER_URL is not configured: pact publication and can-i-deploy are skipped"
          fi

      # Published with the commit SHA as consumer version, the branch and the run URL, like the services' consumer pacts;
      # a changed pact fires the broker's contract_content_changed webhook, which dispatches the provider's pipeline
      # (platform/ci-runner/README.md "Pact Broker webhooks").
      - name: Publish the consumer pacts to the Pact Broker
        if: steps.pact.outputs.enabled == 'true'
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pacts=(build/pacts/storefront-*.json)
          if [ "${#pacts[@]}" -eq 0 ]; then
            echo "::error::npm run pact wrote no build/pacts/storefront-*.json"
            exit 1
          fi
          files=()
          for pact in "${pacts[@]}"; do files+=("$PWD/$pact"); done
          creds=()
          [ -z "$PACT_BROKER_USERNAME" ] || creds+=(-e PACT_BROKER_USERNAME -e PACT_BROKER_PASSWORD)
          docker run --rm --network host -w "$PWD" -v "$PWD:$PWD" -e PACT_BROKER_BASE_URL "${creds[@]}" \
            "$PACT_CLI_IMAGE" publish "${files[@]}" \
            --consumer-app-version "$GITHUB_SHA" --branch "$PACT_BRANCH" \
            --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # The providers verify the new pacts in their own pipelines (dispatched by the broker webhook), so the check waits
      # while results are unknown: PACT_CAN_I_DEPLOY_RETRIES (repository variable, default 24) polls every 10 s.
      # PACT_ENVIRONMENT (optional) restricts the check to the versions deployed to that environment;
      # PACT_CAN_I_DEPLOY=false switches the check off. Same variables as service-ci.yml.
      - name: Can I deploy?
        if: steps.pact.outputs.enabled == 'true' && vars.PACT_CAN_I_DEPLOY != 'false'
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_ENVIRONMENT: ${{ vars.PACT_ENVIRONMENT }}
          RETRIES: ${{ vars.PACT_CAN_I_DEPLOY_RETRIES || '24' }}
        run: |
          set -euo pipefail
          case "$RETRIES" in '' | *[!0-9]*) echo "::error::PACT_CAN_I_DEPLOY_RETRIES must be a number"; exit 1 ;; esac
          creds=()
          [ -z "$PACT_BROKER_USERNAME" ] || creds+=(-e PACT_BROKER_USERNAME -e PACT_BROKER_PASSWORD)
          target=()
          [ -z "$PACT_ENVIRONMENT" ] || target+=(--to-environment "$PACT_ENVIRONMENT")
          docker run --rm --network host -e PACT_BROKER_BASE_URL "${creds[@]}" "$PACT_CLI_IMAGE" \
            pact-broker can-i-deploy --pacticipant storefront --version "$GITHUB_SHA" "${target[@]}" \
            --retry-while-unknown "$RETRIES" --retry-interval 10

      # Dependency scan: osv-scanner reads package-lock.json directly (no conversion as for Gradle). Any known
      # vulnerability fails the step, which includes every CRITICAL one; the repository variable
      # DEPENDENCY_SCAN_ENFORCE=false turns findings into annotations only, as for the services.
      - name: Dependency scan (osv-scanner)
        continue-on-error: ${{ vars.DEPENDENCY_SCAN_ENFORCE == 'false' }}
        run: |
          set -euo pipefail
          # The image's entrypoint lives in /root: the container must run as root, so the input is mounted read-only.
          docker run --rm -v "$PWD/frontend:/src:ro" "$OSV_SCANNER_IMAGE" \
            scan source --lockfile /src/package-lock.json --format table

      # Short-lived diagnosis aid, only when something failed.
      - name: Pack the test and mutation reports
        if: failure()
        run: tar -cf storefront-reports.tar --ignore-failed-read build/pacts frontend/build/stryker-incremental.json

      - name: Upload the test and mutation reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-storefront
          retention-days: 7
          if-no-files-found: ignore
          path: storefront-reports.tar

  image:
    name: image (storefront)
    needs: gate
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      # Podman engines drop HEALTHCHECK from OCI images; BuildKit is what the Dockerfile syntax line expects.
      BUILDAH_FORMAT: docker
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the image coordinates
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-120)"
          repo="${REGISTRY_HOST:+$REGISTRY_HOST/}storefront"
          {
            echo "IMAGE_REPO=$repo"
            echo "IMAGE_SHA=$repo:$GITHUB_SHA"
            echo "IMAGE_BRANCH=$repo:${branch:-unknown}"
          } >> "$GITHUB_ENV"

      # The Node build stage installs from the lock file and runs `npm run build`; the runtime stage is a rootless nginx.
      # The build context is the repository root (the Dockerfile copies the OpenAPI contracts the types are generated from).
      - name: Build the image
        run: |
          docker build -f platform/docker/Dockerfile.storefront \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE_SHA" -t "$IMAGE_BRANCH" .

      # Fails on CRITICAL vulnerabilities that have a fix; the image is scanned before it is pushed.
      - name: Image scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE_SHA"

      - name: Generate the SBOM (syft, CycloneDX)
        run: |
          mkdir -p ci-out
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/ci-out:/out" "$SYFT_IMAGE" \
            scan "docker:$IMAGE_SHA" -o "cyclonedx-json=/out/storefront.cdx.json" -q

      - name: Upload the SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-storefront
          retention-days: 30
          if-no-files-found: ignore
          path: ci-out/*.cdx.json

      # The image runs with its 64m memory bound and no other container; `GET /healthz` must answer `ok` from inside the
      # container within 90 s (.github/scripts/image-health.sh, docs/ci-cd.md "Start-and-health check").
      - name: Start the image and wait for /healthz
        env:
          HEALTH_TIMEOUT: "90"
        run: .github/scripts/image-health.sh storefront "$IMAGE_SHA"

      # Hand-over to the publish job, only when a push to main will publish: the image that was scanned and started is
      # the image that is pushed, whichever runner (and engine) the publish job lands on.
      - name: Save the image for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o ci-image.tar "$IMAGE_SHA" "$IMAGE_BRANCH"

      - name: Upload the image for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-storefront
          retention-days: 1
          if-no-files-found: error
          path: ci-image.tar

  # Pushes the image that `image` built, scanned and started, once `gate` AND `image` have succeeded. Runs on pushes to
  # main only (skipped otherwise, which the aggregate accepts). The registry credentials exist only in this job's step.
  publish:
    name: publish (storefront)
    needs: [gate, image]
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 15
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success' && needs.image.result == 'success'
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
    steps:
      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-storefront

      - name: Load the image
        run: docker load -i ci-image.tar

      # The credentials exist only in this step and in a throw-away Docker config directory.
      - name: Push the image to the private registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$REGISTRY_HOST" ] || [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning::REGISTRY_HOST (variable) or REGISTRY_USERNAME / REGISTRY_PASSWORD (secrets) are not configured: the image was built and scanned but not pushed"
            exit 0
          fi
          branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-120)"
          image_sha="$REGISTRY_HOST/storefront:$GITHUB_SHA"
          image_branch="$REGISTRY_HOST/storefront:${branch:-unknown}"
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'docker logout "$REGISTRY_HOST" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          docker push "$image_sha"
          docker push "$image_branch"
          echo "Pushed \`$image_sha\` and \`$image_branch\`" >> "$GITHUB_STEP_SUMMARY"

  # The required status check, named like the service aggregates: `service-ci / storefront`.
  result:
    name: service-ci / storefront
    needs: [gate, image, publish]
    if: always()
    runs-on: [self-hosted, linux, ecommerce]
    timeout-minutes: 5
    steps:
      - name: Require gate and image to have succeeded (publish too when it ran)
        env:
          GATE: ${{ needs.gate.result }}
          IMAGE: ${{ needs.image.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          echo "gate: $GATE, image: $IMAGE, publish: $PUBLISH"
          [ "$GATE" = success ] && [ "$IMAGE" = success ] && { [ "$PUBLISH" = success ] || [ "$PUBLISH" = skipped ]; }
